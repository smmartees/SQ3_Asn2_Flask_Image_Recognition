# SonarQube Cloud project identification
sonar.projectKey=smmartees_SQ3_Asn2_Flask_Image_Recognition
sonar.organization=smmartees

# Source code
sonar.sources=app.py,model.py

# Test files
sonar.tests=.
sonar.test.inclusions=test_*.py,conftest.py

# Python coverage report
sonar.python.coverage.reportPaths=coverage.xml

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclude test files and test configuration from coverage
sonar.coverage.exclusions=**/test_*.py,**/conftest.py,static/**
