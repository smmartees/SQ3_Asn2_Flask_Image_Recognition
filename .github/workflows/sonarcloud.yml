
name: SonarQube Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  #this gets the entire git history for SonarQube comparison

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  #using same python version for compatibility

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |  #this generates the coverage.xml before SonarQube scans it
          python -m pytest -q --cov=app --cov=model --cov-report=xml:coverage.xml

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
