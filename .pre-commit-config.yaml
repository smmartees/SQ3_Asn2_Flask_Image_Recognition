repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: pylint
        name: Pylint
        entry: python -m pylint
        language: system
        types: [python]
        pass_filenames: false
        args: [app.py, model.py]
